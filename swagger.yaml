openapi: 3.0.0
info:
  title: MedClinic API
  description: API REST para gerenciamento de clínica médica - Etapa de Autenticação e Autorização
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Servidor local de desenvolvimento

tags:
  - name: Autenticação
    description: Cadastro e login de usuários
  - name: Verificação
    description: Endpoints protegidos para validar autenticação e autorização

paths:
  /auth/register:
    post:
      tags:
        - Autenticação
      summary: Cadastra um novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - email
                - senha
              properties:
                nome:
                  type: string
                  example: Dr. João Silva
                email:
                  type: string
                  example: joao@medclinic.com
                senha:
                  type: string
                  example: "123456"
      responses:
        '201':
          description: Usuário criado com sucesso
        '400':
          description: Campos obrigatórios ausentes ou e-mail inválido
        '409':
          description: E-mail já cadastrado

  /auth/login:
    post:
      tags:
        - Autenticação
      summary: Autentica um usuário e retorna um token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - senha
              properties:
                email:
                  type: string
                  example: joao@medclinic.com
                senha:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Login realizado com sucesso
        '400':
          description: E-mail ou senha ausentes
        '401':
          description: Credenciais inválidas

  /users/me:
    get:
      tags:
        - Verificação
      summary: Retorna os dados do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do usuário retornados com sucesso
        '401':
          description: Token ausente, inválido ou expirado

  /admin/ping:
    get:
      tags:
        - Verificação
      summary: Endpoint protegido, acessível apenas por Administradores
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Acesso autorizado
        '401':
          description: Token ausente, inválido ou expirado
        '403':
          description: Acesso negado - permissão insuficiente

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT